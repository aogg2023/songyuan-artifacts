name: gpu-plugin-build
# Build turnip + the NativeMetal plugin (with the pipeline-pack import path) on macOS-14.
# This is .github/workflows/turnip.yml of the data-a-live fork, run here because GitHub
# Actions is disabled for the fork itself. Outputs are uploaded as artifacts instead of
# the turnip-ci pre-release.
on:
  workflow_dispatch:

env:
  UNIXNU_SHA: 1a01c2afa197d975d04da892325c56b6b14aaecb
  NATIVEADRENO_SHA: b686b9054f57d393c80195b82568a09f8ca106a2
  MESA_SHA: 85fda3b36405bcaea8bffc64aa4f2651dc90770d
  NATIVEMETAL_SHA: c6d29caad6d880cc8204ebe3bc34d77479a3255d
  M2V_SHA: 720ef1ce9ae2a2068999a8675717418b9416283e
  ADRENOPM4_SHA: 445f8fe6d115738352b9d78dc70af6d61aa7f62f
  NATIVEMOBILEDISPLAY_SHA: 8666a9950c9699b368931d18cac92c0fdb2ce9c0

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 150
    steps:
      - name: Check out data-a-live (upstream, public: the fork does not carry tools/metal/m2v)
        run: |
          git clone -q --depth 1 https://github.com/ShueiTsuki/data-a-live.git src
          ls src/tools/metal/m2v | head

      - name: Deps
        working-directory: src
        run: |
          brew install glslang bison flex ninja shaderc spirv-tools llvm
          python3 -m venv venv
          echo "$PWD/venv/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix flex)/bin" >> "$GITHUB_PATH"
          rustup toolchain install 1.98.0 --profile minimal --target aarch64-apple-ios

      - name: Sources
        working-directory: src
        run: |
          mkdir -p out
          exec > >(tee -a out/build.log) 2>&1
          fetch() {
            git init -q "$1"
            git -C "$1" fetch -q --depth 1 "$2" "$3"
            git -C "$1" checkout -q FETCH_HEAD
          }
          fetch unixnu https://github.com/UniXNU/UniXNU.git "$UNIXNU_SHA"
          fetch nativeadreno https://github.com/UniXNU/NativeAdreno.git "$NATIVEADRENO_SHA"
          fetch mesa https://chromium.googlesource.com/external/gitlab.freedesktop.org/mesa/mesa "$MESA_SHA" ||
            fetch mesa https://gitlab.freedesktop.org/mesa/mesa.git "$MESA_SHA"
          venv/bin/pip install -q -r unixnu/scripts/requirements-adreno-compiler.txt
          for p in $(python3 -c 'import json; print(" ".join(json.load(open("unixnu/scripts/data/adreno-compiler-inputs.json"))["patches"]))'); do
            echo "== $p"
            git -C mesa apply --whitespace=nowarn "$PWD/unixnu/$p"
          done
          python3 tools/turnip/pandora_rpstats.py mesa
          python3 tools/turnip/pandora_wait.py mesa
          python3 tools/turnip/pandora_submit_wait.py mesa
          ls nativeadreno/NativeAdrenoABI.h
          python3 tools/turnip/abi_128.py nativeadreno/NativeAdrenoABI.h
          cmp nativeadreno/NativeAdrenoABI.h <(tr -d '\r' < wsl/adreno/NativeAdrenoABI.h)

      - name: Build turnip
        working-directory: src
        run: |
          set -o pipefail
          bash tools/turnip/build_ios.sh mesa nativeadreno out 2>&1 | tee -a out/build.log

      - name: Metal plugin
        working-directory: src
        timeout-minutes: 40
        run: |
          set -o pipefail
          exec > >(tee -a out/metal.log) 2>&1
          fetch() {
            git init -q "$1"
            git -C "$1" fetch -q --depth 1 "$2" "$3"
            git -C "$1" checkout -q FETCH_HEAD
          }
          fetch nativemetal https://github.com/UniXNU/NativeMetal.git "$NATIVEMETAL_SHA"
          fetch metal2vulkan https://github.com/steelbrain/metal2vulkan.git "$M2V_SHA"
          rm -rf unixnu/kits/AdrenoPM4
          fetch unixnu/kits/AdrenoPM4 https://github.com/UniXNU/AdrenoPM4.git "$ADRENOPM4_SHA"
          fetch NativeMobileDisplay https://github.com/UniXNU/NativeMobileDisplay.git "$NATIVEMOBILEDISPLAY_SHA"
          for p in tools/metal/m2v/[0-9][0-9][0-9][0-9]-*.patch; do
            echo "   m2v/$(basename "$p")"
            git -C metal2vulkan apply --whitespace=nowarn "$p"
          done
          bash tools/metal/build_plugin.sh unixnu nativemetal nativeadreno metal2vulkan mesa out/metal

      - name: Summaries
        if: always()
        working-directory: src
        run: |
          {
            echo '### errors'; echo '```'
            grep -E 'error:|FAILED:|fatal|ERROR:' out/build.log out/metal.log 2>/dev/null | head -60 || true
            echo '```'; echo '### last lines'; echo '```'
            tail -40 out/build.log 2>/dev/null || true
            tail -40 out/metal.log 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpu-metal
          path: |
            src/out/libvulkan_freedreno.dylib
            src/out/vktest
            src/out/SHA256SUMS
            src/out/build.log
            src/out/metal.log
            src/out/metal/NativeAdrenoMetal.bundle/NativeAdrenoMetal
            src/out/metal/NativeAdrenoMetal.bundle/Info.plist
            src/out/metal/mtltest
            src/out/metal/SHA256SUMS
          if-no-files-found: warn