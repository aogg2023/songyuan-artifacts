name: symbolicate-stacks
# Look up dyld shared cache symbols for slid addresses from PANDORA STACKS / crash dumps,
# and optionally disassemble given unslid virtual addresses (printing context around each).
on:
  workflow_dispatch:
    inputs:
      slide:
        description: process slide (hex, e.g. 0x17220000)
        required: true
      addresses:
        description: slid addresses, one per line (hex)
        required: true
      disass_vaddrs:
        description: unslid virtual addresses to disassemble, comma separated (optional)
        required: false
        default: ""
permissions:
  contents: write
jobs:
  symbols:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: tooling
        run: |
          brew install blacktop/tap/ipsw || brew install ipsw || true
          ipsw version
      - name: IPSW
        env:
          VERSION: "16.7.16"
          DEVICE: "iPhone10,3"
        run: |
          set -euo pipefail
          mkdir -p ipsw dsc out
          ipsw download ipsw --device "$DEVICE" --version "$VERSION" -o ipsw
          ls -lh ipsw
      - name: dyld shared cache
        run: |
          set -euo pipefail
          IPSW=$(ls ipsw/*.ipsw | head -1)
          ipsw extract --dyld --device iPhone10,3 --dyld-arch arm64 -o dsc "$IPSW"
          find dsc -maxdepth 2 -type f -name 'dyld_shared_cache_arm64*' | head -5
      - name: symbols
        env:
          SLIDE: ${{ inputs.slide }}
          ADDRESSES: ${{ inputs.addresses }}
        run: |
          set -euo pipefail
          DSC=$(find dsc -maxdepth 2 -type f -name dyld_shared_cache_arm64 | head -1)
          echo "cache: $DSC"
          : > out/symbols.txt
          while read -r a; do
            [ -z "$a" ] && continue
            echo "== $a" >> out/symbols.txt
            ipsw dyld a2s --slide "$SLIDE" -i "$DSC" "$a" >> out/symbols.txt 2>&1 || true
          done <<< "$ADDRESSES"
          echo "--- tail ---"
          tail -120 out/symbols.txt
      - name: disassemble
        if: ${{ inputs.disass_vaddrs != '' }}
        env:
          DISASS: ${{ inputs.disass_vaddrs }}
        run: |
          set -euo pipefail
          DSC=$(find dsc -maxdepth 2 -type f -name dyld_shared_cache_arm64 | head -1)
          : > out/disass.txt
          for a in $(echo "$DISASS" | tr ',' ' '); do
            echo "== $a" >> out/disass.txt
            ipsw dyld disass --vaddr "$a" --quiet "$DSC" >> out/disass.txt 2>&1 || true
          done
          : > out/context.txt
          for a in $(echo "$DISASS" | tr ',' ' '); do
            echo "===== before $a" >> out/context.txt
            grep -B 30 "^$a:" out/disass.txt >> out/context.txt 2>&1 || true
            echo "===== at/after $a" >> out/context.txt
            grep -A 80 "^$a:" out/disass.txt >> out/context.txt 2>&1 || true
          done
          cat out/context.txt
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG=symbols
          gh release view "$TAG" -R "$REPO" >/dev/null 2>&1 || gh release create "$TAG" -R "$REPO" --title "symbolication output" --notes "ipsw dyld output for stack dumps"
          gh release upload "$TAG" out/symbols.txt -R "$REPO" --clobber
          if [ -f out/disass.txt ]; then gh release upload "$TAG" out/disass.txt -R "$REPO" --clobber; fi
          if [ -f out/context.txt ]; then gh release upload "$TAG" out/context.txt -R "$REPO" --clobber; fi
          echo "PUBLIC: https://github.com/$REPO/releases/download/$TAG/"
