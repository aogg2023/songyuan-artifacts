name: xnu-songyuan-build
# Build the songyuan XNU kernel from the aogg2023/data-a-live patch set.
# This lives in the artifacts repo because GitHub Actions is disabled for the fork.
on:
  workflow_dispatch:
    inputs:
      macos_version:
        description: macOS release whose xnu to build (13.5 = xnu-8796, iOS 16 era)
        default: "13.5"
      kernel_config:
        description: RELEASE / DEVELOPMENT / DEBUG
        default: DEVELOPMENT
      machine_config:
        description: xnu MACHINE_CONFIG (PANDORA = Xiaomi 17 Pro, 4 KiB pages)
        default: PANDORA
      keep_going:
        description: make -k
        default: "true"
env:
  DXB_REPO: https://github.com/blacktop/darwin-xnu-build
  DXB_SHA: 663906528d1cd5ea8fde7de6f16de73db9511549
  MACOS_VERSION: ${{ inputs.macos_version || '13.5' }}
  KERNEL_CONFIG: ${{ inputs.kernel_config || 'DEVELOPMENT' }}
  MACHINE_CONFIG: ${{ inputs.machine_config || 'PANDORA' }}
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - name: Check out the patch set
        uses: actions/checkout@v4
        with:
          repository: aogg2023/data-a-live
          ref: main
          path: src

      - name: Prefer the BearSSL mirror (bearssl.org returns 502 intermittently)
        run: |
          git config --global url."https://github.com/AmanoTeam/BearSSL".insteadOf "https://www.bearssl.org/git/BearSSL"
          git config --global --get-regexp '^url\.' || true

      - name: Adapt the patches to songyuan
        run: |
          cp -R src/xnu src/songyuan .
          python3 songyuan/adapt.py || true
          grep -c '1200' xnu/patches/0217-pandora-scanout.patch || true
          ls xnu/patches | tail -8

      - name: Fetch build script
        run: |
          git init -q dxb
          git -C dxb fetch -q --depth 1 "$DXB_REPO" "$DXB_SHA"
          git -C dxb checkout -q FETCH_HEAD
          cp xnu/patches/*.patch xnu/patches/*.sh dxb/patches/
          sed -i '' 's/\[\[ "\${MACHINE_CONFIG:-}" == SWEET \]\]/[[ "${MACHINE_CONFIG:-}" =~ ^(SWEET|FUXI|PANDORA)$ ]]/' dxb/patches/*.sh
          sed -i '' 's/ARCHS="x86_64 arm64e" VALID_ARCHS="x86_64 arm64e"/ARCHS="x86_64 arm64e arm64" VALID_ARCHS="x86_64 arm64e arm64"/' dxb/build.sh
          ls dxb/patches | tail -5

      - name: Deps
        run: |
          brew install jq gum bash cmake ninja
          printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/local/bin/xcodes >/dev/null
          sudo chmod +x /usr/local/bin/xcodes
          XC=$(ls -d /Applications/Xcode_15*.app 2>/dev/null | sort -V | head -1)
          [ -n "$XC" ] || XC=$(ls -d /Applications/Xcode_*.app | sort -V | head -1)
          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Build
        working-directory: dxb
        env:
          MAKEFLAGS: ${{ inputs.keep_going == 'false' && '' || '-k' }}
        run: bash build.sh

      - name: Collect
        if: always()
        run: |
          mkdir -p out
          cp -R dxb/fakeroot/System/Library/Kernels/. out/ 2>/dev/null || true
          ls -la out
          (cd out && shasum -a 256 kernel.* > SHA256SUMS) || true

      - name: Verify patches landed
        if: always()
        run: |
          echo "source kpi_vfs.c sweetdataprotect: $(grep -c sweetdataprotect dxb/xnu/bsd/vfs/kpi_vfs.c || true)"
          echo "source hfs_vnops.c pandora_dp_none: $(grep -c pandora_dp_none dxb/xnu/bsd/sweet_hfs/core/hfs_vnops.c || true)"
          K=out/kernel.development.pandora
          echo "kernel sweetdataprotect: $(strings "$K" | grep -c sweetdataprotect || true)"
          echo "kernel pandora_dumpnewest: $(strings "$K" | grep -c pandora_dumpnewest || true)"
          echo "kernel 0335 marker com.pandora.dataprotect-class: $(strings "$K" | grep -c com.pandora.dataprotect-class || true)"
          echo "kernel 0336 marker PANDORA POSTER RESET: $(strings "$K" | grep -c "PANDORA POSTER RESET" || true)"
          echo "kernel 0336 boot-arg pandora_poster_reset: $(strings "$K" | grep -c pandora_poster_reset || true)"
          echo "kernel 0337 marker PANDORA DPT: $(strings "$K" | grep -c "PANDORA DPT" || true)"
          echo "kernel 0338 marker PANDORA FILES mode: $(strings "$K" | grep -c "PANDORA FILES: mode" || true)"
          echo "kernel 0339 marker SWEET AMFI: $(strings "$K" | grep -c 'SWEET AMFI' || true)"
          echo "kernel 0340 marker SWEET LS: $(strings "$K" | grep -c 'SWEET LS: unlink' || true)"
          if [ "$(strings "$K" | grep -c 'SWEET AMFI' || true)" -eq 0 ]; then echo "ERROR: 0339 marker SWEET AMFI missing (patch skipped?)"; exit 1; fi
          if [ "$(strings "$K" | grep -c 'SWEET LS: unlink' || true)" -eq 0 ]; then echo "ERROR: 0340 marker SWEET LS missing (patch skipped?)"; exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-kernel
          path: out/
          if-no-files-found: warn
